        async function handleContactSubmit(event) {
            event.preventDefault();

            const originalText = button.innerText;

            button.disabled = true;
            const formData = new FormData(form);
            try {
                const response = await fetch("https://formspree.io/f/info@recruitovate.com", {
                    method: "POST",
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                if (response.ok) {
                    document.getElementById('contactForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    alert("Submission issue. Please email info@recruitovate.com directly.");
                    button.innerText = originalText;
                    button.disabled = false;
                }
            } catch (error) {
                document.getElementById('contactForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            }
        }

                            <form class="space-y-6" onsubmit="handleContactSubmit(event)">
                                <div class="grid sm:grid-cols-2 gap-6">
                                    <div class="border-b border-slate-200 pb-1">
                                        <label class="block text-[9px] uppercase tracking-widest font-bold text-slate-400">Name</label>
                                        <input type="text" name="name" required class="w-full bg-transparent text-[14px] focus:outline-none font-bold" />
                                    </div>
                                    <div class="border-b border-slate-200 pb-1">
                                        <label class="block text-[9px] uppercase tracking-widest font-bold text-slate-400">Email</label>
                                        <input type="email" name="email" required class="w-full bg-transparent text-[14px] focus:outline-none font-bold" />
                                    </div>
                                </div>
                                <div class="border-b border-slate-200 pb-1">
                                    <label class="block text-[9px] uppercase tracking-widest font-bold text-slate-400">Message</label>
                                    <textarea name="message" required class="w-full bg-transparent text-[14px] focus:outline-none h-32 resize-none"></textarea>
                                </div>
                                <button type="submit" class="w-full bg-slate-900 text-white py-4 text-[10px] uppercase tracking-[0.3em] font-black hover:bg-[#E35D2B] transition-all">SUBMIT MANDATE</button>
                            </form>
                        </div>
                        <div id="successMessage" class="text-center py-6">
                            <i data-lucide="check-circle" class="w-12 h-12 text-[#E35D2B] mx-auto mb-4"></i>
                            <h2 class="text-xl font-bold mb-2">Mandate Received</h2>
                            <p class="text-slate-600 mb-6 text-sm">Our team will contact you shortly.</p>
                            <button onclick="showPage('Home')" class="text-[9px] uppercase tracking-[0.3em] font-bold text-slate-400 hover:text-slate-900">Return Home</button>
                        </div>
                    </div>
                </div>
            `
        };

        window.onload = () => {
            showPage('Home');
        };
    </script>
</body>
</html>
